<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Торговая Площадка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --modal-bg: #161622;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --text-main: #ffffff;
            --text-secondary: #a0a0b2;
            --border-color: #2a2a3a;
            --danger-color: #ff4757;
            --success-color: #2ed573;
            --urgent-color: #ff7675;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(15, 15, 19, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-filter-icon {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .container {
            padding: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
        }

        .btn-clear {
            background: none;
            border: none;
            color: var(--urgent-color);
            font-size: 12px;
            cursor: pointer;
            display: none;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card-preview {
            height: 120px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .card-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .card-tag.urgent {
            background: var(--danger-color);
        }

        .like-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }

        .card-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .card-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: auto;
            padding-top: 6px;
        }

        .dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(22, 22, 34, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .dock-tab {
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
            width: 20%;
        }

        .dock-tab.active {
            color: var(--accent-color);
        }

        .dock-tab .icon {
            font-size: 18px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--modal-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid var(--border-color);
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary:active {
            background: var(--accent-hover);
        }

        /* Profile & Lots */
        .profile-section {
            display: none;
        }

        .my-lot-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .my-lot-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
        }

        .my-lot-info {
            flex: 1;
        }

        .my-lot-title {
            font-size: 13px;
            font-weight: 600;
        }

        .my-lot-price {
            font-size: 13px;
            color: var(--accent-color);
            font-weight: 700;
        }

        .my-lot-btns {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-lot-action {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-lot-delete {
            background: var(--danger-color);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .chat-list-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .msg-bubble.me {
            background: var(--accent-color);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .msg-bubble.other {
            background: var(--card-bg);
            color: var(--text-main);
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-tg { background: #0088cc; }
        .btn-vk { background: #4c75a3; }
        .btn-ds { background: #5865f2; }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="header-top">
            <div class="header-title">🛒 Marketplace</div>
            <button class="btn-filter-icon" onclick="toggleModal('filterModal', true)">⚙️ Фильтры</button>
        </div>
        <div class="search-box" id="searchBarBox">
            <input type="text" class="search-input" placeholder="Поиск авто, недвижимости..." oninput="handleSearchInput(this.value)">
        </div>
    </header>

    <div class="container">
        <div class="section-header">
            <div class="section-title" id="sectionTitle">🔥 Все объявления</div>
            <button class="btn-clear" id="clearAuthorBtn" onclick="clearAuthorFilter()">Сбросить автора</button>
        </div>

        <div class="feed-grid" id="feedContainer"></div>

        <div class="profile-section" id="profileSection">
            <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 20px;">
                <h3 style="margin-bottom: 12px; font-size: 15px;">👤 Настройки профиля</h3>
                <div class="form-group">
                    <label>Ник на сайте / в приложении</label>
                    <input type="text" id="profSiteNick" class="form-control">
                </div>
                <div class="form-group">
                    <label>Игровой Nick_Name</label>
                    <input type="text" id="profGameNick" class="form-control">
                </div>
                <div class="form-group">
                    <label>Игровой номер телефона</label>
                    <input type="text" id="profGamePhone" class="form-control">
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="toggleTg" onchange="toggleSocialField('Tg')">
                    <label for="toggleTg" style="margin: 0;">Указывать Telegram</label>
                </div>
                <div class="form-group" id="boxTgInput">
                    <input type="text" id="profTgLink" class="form-control" placeholder="https://t.me/username">
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="toggleVk" onchange="toggleSocialField('Vk')">
                    <label for="toggleVk" style="margin: 0;">Указывать VK</label>
                </div>
                <div class="form-group" id="boxVkInput">
                    <input type="text" id="profVkLink" class="form-control" placeholder="https://vk.com/id">
                </div>
                <div class="form-group">
                    <label>Discord Tag</label>
                    <input type="text" id="profDiscord" class="form-control" placeholder="username#0000">
                </div>
                <button class="btn-primary" onclick="saveProfileSettings()">Сохранить профиль</button>
            </div>

            <div class="section-header">
                <div class="section-title">📦 Мои опубликованные лоты</div>
                <span id="myLotsCount" style="font-size: 12px; color: var(--text-secondary);">0 шт</span>
            </div>
            <div id="myLotsContainer"></div>
        </div>
    </div>

    <!-- Navigation Dock -->
    <div class="dock">
        <button class="dock-tab active" onclick="switchTab(this, 'feed')">
            <span class="icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="dock-tab" onclick="switchTab(this, 'wishlist')">
            <span class="icon">❤️</span>
            <span>Избранное</span>
        </button>
        <button class="dock-tab" onclick="switchTab(this, 'create')">
            <span class="icon">➕</span>
            <span>Продать</span>
        </button>
        <button class="dock-tab" onclick="switchTab(this, 'chats')">
            <span class="icon">💬</span>
            <span>Чаты</span>
        </button>
        <button class="dock-tab" onclick="switchTab(this, 'profile')">
            <span class="icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <!-- Create Product Modal -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Разместить объявление</h3>
                <button class="modal-close" onclick="toggleModal('createModal', false)">✕</button>
            </div>
            <div class="form-group">
                <label>Название товара/имущества</label>
                <input type="text" id="createTitle" class="form-control" placeholder="например: BMW M5 F90">
            </div>
            <div class="form-group">
                <label>Категория</label>
                <select id="createCategory" class="form-control">
                    <option value="auto">🏎️ Авторынок</option>
                    <option value="realty">🏰 Недвижимость</option>
                    <option value="business">💎 Бизнес</option>
                    <option value="skins">👕 Скины/Аксессуары</option>
                    <option value="numbers">📞 Номера/Сим</option>
                    <option value="other">📦 Прочее</option>
                </select>
            </div>
            <div class="form-group">
                <label>Номер сервера</label>
                <input type="number" id="createServer" class="form-control" placeholder="1">
            </div>
            <div class="form-group">
                <label>Цена (₽)</label>
                <input type="number" id="createPrice" class="form-control" placeholder="1000000">
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="createUrgent">
                <label for="createUrgent" style="margin: 0;">Срочная продажа (метка 🔥)</label>
            </div>
            <div class="form-group">
                <label>Фотография (загрузка)</label>
                <div id="uploadPreview" style="height: 100px; background: var(--card-bg); border: 1px dashed var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background-size: cover; background-position: center;" onclick="triggerFileInput('createImageInput')">
                    <span id="uploadHint" style="font-size: 12px; color: var(--text-secondary);">📷 Нажмите, чтобы выбрать фото</span>
                </div>
                <input type="file" id="createImageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event, 'uploadPreview', 'uploadHint')">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="createDesc" class="form-control" placeholder="Укажите комплектацию, торг, характеристики..."></textarea>
            </div>
            <button class="btn-primary" onclick="submitNewProduct()">Опубликовать</button>
        </div>
    </div>

    <!-- Edit Product Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Редактировать объявление</h3>
                <button class="modal-close" onclick="toggleModal('editModal', false)">✕</button>
            </div>
            <input type="hidden" id="editProductId">
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="editTitle" class="form-control">
            </div>
            <div class="form-group">
                <label>Категория</label>
                <select id="editCategory" class="form-control">
                    <option value="auto">🏎️ Авторынок</option>
                    <option value="realty">🏰 Недвижимость</option>
                    <option value="business">💎 Бизнес</option>
                    <option value="skins">👕 Скины/Аксессуары</option>
                    <option value="numbers">📞 Номера/Сим</option>
                    <option value="other">📦 Прочее</option>
                </select>
            </div>
            <div class="form-group">
                <label>Сервер</label>
                <input type="number" id="editServer" class="form-control">
            </div>
            <div class="form-group">
                <label>Цена (₽)</label>
                <input type="number" id="editPrice" class="form-control">
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="editUrgent">
                <label for="editUrgent" style="margin: 0;">Срочная продажа</label>
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="editDesc" class="form-control"></textarea>
            </div>
            <button class="btn-primary" onclick="saveProductEdits()">Сохранить изменения</button>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="pModalTag" class="card-tag">Активно</span>
                <button class="modal-close" onclick="toggleModal('productModal', false)">✕</button>
            </div>
            <div id="pModalImg" style="height: 180px; background-size: cover; background-position: center; border-radius: 10px; margin-bottom: 12px;"></div>
            <div id="pModalPrice" style="font-size: 20px; font-weight: 700; color: var(--accent-color); margin-bottom: 4px;"></div>
            <h2 id="pModalTitle" style="font-size: 16px; margin-bottom: 8px;"></h2>
            <div style="display: flex; gap: 10px; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;">
                <span id="pModalCategory"></span>
                <span id="pModalServer"></span>
            </div>
            <div style="font-size: 13px; line-height: 1.5; margin-bottom: 16px;" id="pModalDesc"></div>

            <div style="background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                <div style="font-size: 11px; color: var(--text-secondary); margin-bottom: 4px;">ПРОДАВЕЦ</div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <div style="font-weight: 600; font-size: 14px;" id="pModalSiteNick"></div>
                    <button style="background: none; border: none; color: var(--accent-color); font-size: 11px; cursor: pointer;" onclick="filterByCurrentAuthor()">Все лоты автора</button>
                </div>
                <div style="font-size: 12px; color: var(--text-secondary);">
                    <div>🎮 Игровой ник: <b id="pModalNick" style="color: var(--text-main);"></b></div>
                    <div>📞 Игровой тел: <b id="pModalPhone" style="color: var(--text-main);"></b></div>
                </div>
                <button style="width: 100%; margin-top: 8px; background: var(--border-color); color: white; border: none; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer;" onclick="copyInGameInfo()">📋 Скопировать игровы данные</button>
            </div>

            <div class="contact-links">
                <a id="btnTg" href="#" target="_blank" class="contact-btn btn-tg">Написать в Telegram</a>
                <a id="btnVk" href="#" target="_blank" class="contact-btn btn-vk">Открыть профиль VK</a>
                <button id="btnDs" class="contact-btn btn-ds" onclick="copyDiscord()">Discord: <span id="pModalDs"></span></button>
                <button class="btn-primary" onclick="openChatFromProduct()">💬 Написать в чат приложения</button>
            </div>
        </div>
    </div>

    <!-- Filter Modal -->
    <div class="modal" id="filterModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Фильтры поиска</h3>
                <button class="modal-close" onclick="toggleModal('filterModal', false)">✕</button>
            </div>
            <div class="form-group">
                <label>Категория</label>
                <select id="categorySelect" class="form-control">
                    <option value="all">Все категории</option>
                    <option value="auto">🏎️ Авторынок</option>
                    <option value="realty">🏰 Недвижимость</option>
                    <option value="business">💎 Бизнес</option>
                    <option value="skins">👕 Скины/Аксессуары</option>
                    <option value="numbers">📞 Номера/Сим</option>
                    <option value="other">📦 Прочее</option>
                </select>
            </div>
            <div class="form-group">
                <label>Сервер</label>
                <select id="serverSelect" class="form-control">
                    <option value="all">Все сервера</option>
                    <option value="1">Сервер #1</option>
                    <option value="2">Сервер #2</option>
                    <option value="3">Сервер #3</option>
                </select>
            </div>
            <div class="form-group">
                <label>Цена от (₽)</label>
                <input type="number" id="priceFrom" class="form-control" placeholder="0">
            </div>
            <div class="form-group">
                <label>Цена до (₽)</label>
                <input type="number" id="priceTo" class="form-control" placeholder="100000000">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" style="background: var(--border-color);" onclick="resetFilters()">Сбросить</button>
                <button class="btn-primary" onclick="applyFilters()">Применить</button>
            </div>
        </div>
    </div>

    <!-- Chat Conversation Modal -->
    <div class="modal" id="chatConversationModal">
        <div class="modal-content" style="height: 80vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <div>
                    <h3 id="chatHeaderNick">Чат</h3>
                    <div id="chatHeaderProduct" style="font-size: 11px; color: var(--text-secondary);"></div>
                </div>
                <button class="modal-close" onclick="toggleModal('chatConversationModal', false)">✕</button>
            </div>
            <div id="chatMessagesList" style="flex: 1; overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column;"></div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <input type="text" id="chatInput" class="form-control" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                <button class="btn-primary" style="width: auto; padding: 0 16px; margin: 0;" onclick="sendChatMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Профиль текущего пользователя (привязка к уникальному Telegram ID)
        let USER_PROFILE = {
            tgId: tg?.initDataUnsafe?.user?.id || 77777777, // Неизменяемый ID
            siteNick: tg?.initDataUnsafe?.user?.first_name || "МойПрофиль",
            gameNick: "EGOR_CRED",
            gamePhone: "777-888",
            hasTg: true,
            tgLink: "https://t.me/telegram",
            hasVk: true,
            vkLink: "https://vk.com",
            discord: "egor_m5#1234"
        };

        const CATEGORY_NAMES = {
            auto: "🏎️ Авторынок",
            realty: "🏰 Недвижимость",
            business: "💎 Бизнес",
            skins: "👕 Скины/Аксессуары",
            numbers: "📞 Номера/Сим",
            other: "📦 Прочее"
        };

        const PRODUCTS = [
            {
                id: 1,
                title: "BMW M5 F90",
                price: "12.500.000 ₽",
                priceNum: 12500000,
                category: "auto",
                tag: "ФТ / СТ",
                isUrgent: false,
                server: 1,
                time: "5m ago",
                image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=400",
                desc: "Продам отличную фт ст ф90. Внешний вид идеальный. Торг у капота.",
                seller: {
                    tgId: 77777777, // Telegram ID автора
                    siteNick: "МойПрофиль",
                    nick: "EGOR_CRED",
                    phone: "777-888",
                    hasTg: true,
                    tg: "https://t.me/telegram",
                    hasVk: true,
                    vk: "https://vk.com",
                    hasDs: true,
                    discord: "egor_m5#1234"
                }
            },
            {
                id: 2,
                title: "Особняк Рублевка",
                price: "120.000.000 ₽",
                priceNum: 120000000,
                category: "realty",
                tag: "🔥 СРОЧНО",
                isUrgent: true,
                server: 1,
                time: "1h ago",
                image: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400",
                desc: "Элитный дом на Рублевке с ремонтом хайтек, автополив.",
                seller: {
                    tgId: 99999999, // Другой пользователь
                    siteNick: "Maxim_Imperator",
                    nick: "MAXIM_IMPERATOR",
                    phone: "100-001",
                    hasTg: true,
                    tg: "https://t.me/telegram",
                    hasVk: false,
                    vk: "",
                    hasDs: true,
                    discord: "imperator_rp"
                }
            }
        ];

        let CHATS = [];
        let likedProductIds = new Set();
        let currentTabMode = 'feed';
        let currentActiveProduct = null;
        let activeChatId = null;
        let uploadedImageBase64 = null;

        let activeFilters = {
            searchQuery: '',
            category: 'all',
            server: 'all',
            priceFrom: null,
            priceTo: null,
            authorSiteNick: null
        };

        // Инициализация формы профиля
        function initProfileInputs() {
            document.getElementById('profSiteNick').value = USER_PROFILE.siteNick;
            document.getElementById('profGameNick').value = USER_PROFILE.gameNick;
            document.getElementById('profGamePhone').value = USER_PROFILE.gamePhone;

            document.getElementById('toggleTg').checked = USER_PROFILE.hasTg;
            document.getElementById('profTgLink').value = USER_PROFILE.tgLink;
            document.getElementById('boxTgInput').style.display = USER_PROFILE.hasTg ? 'block' : 'none';

            document.getElementById('toggleVk').checked = USER_PROFILE.hasVk;
            document.getElementById('profVkLink').value = USER_PROFILE.vkLink;
            document.getElementById('boxVkInput').style.display = USER_PROFILE.hasVk ? 'block' : 'none';

            document.getElementById('profDiscord').value = USER_PROFILE.discord;
        }

        function toggleSocialField(type) {
            const isChecked = document.getElementById(`toggle${type}`).checked;
            document.getElementById(`box${type}Input`).style.display = isChecked ? 'block' : 'none';
        }

        function saveProfileSettings() {
            const siteNick = document.getElementById('profSiteNick').value.trim();
            const gameNick = document.getElementById('profGameNick').value.trim();
            const gamePhone = document.getElementById('profGamePhone').value.trim();

            if (!siteNick || !gameNick || !gamePhone) {
                alert('Заполните обязательные поля профиля!');
                return;
            }

            USER_PROFILE.siteNick = siteNick;
            USER_PROFILE.gameNick = gameNick;
            USER_PROFILE.gamePhone = gamePhone;

            USER_PROFILE.hasTg = document.getElementById('toggleTg').checked;
            USER_PROFILE.tgLink = document.getElementById('profTgLink').value.trim();

            USER_PROFILE.hasVk = document.getElementById('toggleVk').checked;
            USER_PROFILE.vkLink = document.getElementById('profVkLink').value.trim();

            USER_PROFILE.discord = document.getElementById('profDiscord').value.trim();

            // Обновляем ники и контакты во всех ранее опубликованных товарах этого пользователя
            PRODUCTS.forEach(p => {
                if (p.seller.tgId === USER_PROFILE.tgId) {
                    p.seller.siteNick = USER_PROFILE.siteNick;
                    p.seller.nick = USER_PROFILE.gameNick;
                    p.seller.phone = USER_PROFILE.gamePhone;
                    p.seller.hasTg = USER_PROFILE.hasTg;
                    p.seller.tg = USER_PROFILE.tgLink;
                    p.seller.hasVk = USER_PROFILE.hasVk;
                    p.seller.vk = USER_PROFILE.vkLink;
                    p.seller.hasDs = Boolean(USER_PROFILE.discord);
                    p.seller.discord = USER_PROFILE.discord;
                }
            });

            tg?.HapticFeedback?.notificationOccurred('success');
            alert('Настройки профиля и карточки ваших товаров обновлены!');
            renderProfileSection();
            renderFeed();
        }

        // Рендер раздела Профиль и Моих лотов
        function renderProfileSection() {
            const container = document.getElementById('myLotsContainer');
            container.innerHTML = '';

            // Поиск лотов строго по уникальному tgId
            const myProducts = PRODUCTS.filter(p => p.seller.tgId === USER_PROFILE.tgId);
            document.getElementById('myLotsCount').innerText = `${myProducts.length} шт`;

            if (myProducts.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px;">
                        У вас пока нет опубликованных объявлений.
                    </div>
                `;
                return;
            }

            myProducts.forEach(item => {
                const row = document.createElement('div');
                row.className = 'my-lot-item';

                row.innerHTML = `
                    <div class="my-lot-img" style="background-image: url('${item.image}');"></div>
                    <div class="my-lot-info">
                        <div class="my-lot-title">${item.title}</div>
                        <div class="my-lot-price">${item.price}</div>
                        <div style="font-size: 10px; color: var(--text-secondary);">Сервер #${item.server}</div>
                    </div>
                    <div class="my-lot-btns">
                        <button class="btn-lot-action btn-lot-edit" onclick="openEditProductModal(${item.id})">✏️ Изменить</button>
                        <button class="btn-lot-action btn-lot-delete" onclick="deleteMyProduct(${item.id})">🗑️ Удалить</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Рендер списка чатов
        function renderChatsList(container) {
            if (CHATS.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <div class="empty-title">У вас нет активных чатов</div>
                        <div class="empty-text">Откройте карточку любого товара и нажмите "Написать в чат".</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            CHATS.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'chat-list-item';
                item.onclick = () => openChatDialog(chat.id);
                item.innerHTML = `
                    <div style="font-size: 24px;">${chat.avatar}</div>
                    <div style="flex: 1;">
                        <div style="display: flex; justify-content: space-between;">
                            <span style="font-weight: 600; font-size: 14px;">${chat.sellerSiteNick}</span>
                            <span style="font-size: 10px; color: var(--text-secondary);">${chat.time}</span>
                        </div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">📦 ${chat.productTitle}</div>
                        <div style="font-size: 12px; color: var(--text-main); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${chat.lastMsg}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Модальное окно редактирования своего лота
        function openEditProductModal(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('editProductId').value = product.id;
            document.getElementById('editTitle').value = product.title;
            document.getElementById('editCategory').value = product.category;
            document.getElementById('editServer').value = product.server;
            document.getElementById('editPrice').value = product.priceNum;
            document.getElementById('editUrgent').checked = product.isUrgent;
            document.getElementById('editDesc').value = product.desc;

            toggleModal('editModal', true);
        }

        function saveProductEdits() {
            const id = Number(document.getElementById('editProductId').value);
            const product = PRODUCTS.find(p => p.id === id);
            if (!product) return;

            const title = document.getElementById('editTitle').value.trim();
            const category = document.getElementById('editCategory').value;
            const server = Number(document.getElementById('editServer').value);
            const priceVal = Number(document.getElementById('editPrice').value);
            const isUrgent = document.getElementById('editUrgent').checked;
            const desc = document.getElementById('editDesc').value.trim();

            if (!title || !priceVal || !desc) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            product.title = title;
            product.category = category;
            product.server = server;
            product.priceNum = priceVal;
            product.price = priceVal.toLocaleString('ru-RU') + ' ₽';
            product.isUrgent = isUrgent;
            product.tag = isUrgent ? '🔥 СРОЧНО' : 'Активно';
            product.desc = desc;

            tg?.HapticFeedback?.notificationOccurred('success');
            toggleModal('editModal', false);
            renderFeed();
            renderProfileSection();
        }

        function deleteMyProduct(productId) {
            if (confirm("Вы точно хотите удалить это объявление?")) {
                const index = PRODUCTS.findIndex(p => p.id === productId);
                if (index !== -1) {
                    PRODUCTS.splice(index, 1);
                    tg?.HapticFeedback?.notificationOccurred('success');
                    renderFeed();
                    renderProfileSection();
                }
            }
        }

        // Лента объявлений
        function renderFeed() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';

            if (currentTabMode === 'chats') {
                container.style.display = 'block';
                renderChatsList(container);
                return;
            } else {
                container.style.display = 'grid';
            }

            const filteredItems = PRODUCTS.filter(item => {
                if (currentTabMode === 'wishlist' && !likedProductIds.has(item.id)) return false;

                if (activeFilters.authorSiteNick && item.seller.siteNick.toLowerCase() !== activeFilters.authorSiteNick.toLowerCase()) {
                    return false;
                }

                if (activeFilters.searchQuery) {
                    const matchTitle = item.title.toLowerCase().includes(activeFilters.searchQuery);
                    const matchDesc = item.desc.toLowerCase().includes(activeFilters.searchQuery);
                    if (!matchTitle && !matchDesc) return false;
                }

                if (activeFilters.category !== 'all' && item.category !== activeFilters.category) return false;
                if (activeFilters.server !== 'all' && String(item.server) !== String(activeFilters.server)) return false;
                if (activeFilters.priceFrom !== null && item.priceNum < activeFilters.priceFrom) return false;
                if (activeFilters.priceTo !== null && item.priceNum > activeFilters.priceTo) return false;

                return true;
            });

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: span 2;">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">Объявлений не найдено</div>
                        <div class="empty-text">Попробуйте изменить параметры поиска или сбросить фильтры.</div>
                    </div>
                `;
                return;
            }

            filteredItems.forEach(item => {
                const isLiked = likedProductIds.has(item.id);
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openProductDetails(item.id);

                const tagClass = item.isUrgent ? 'card-tag urgent' : 'card-tag';

                card.innerHTML = `
                    <div class="card-preview" style="background-image: url('${item.image}');">
                        <span class="${tagClass}">${item.tag}</span>
                        <button class="like-btn ${isLiked ? 'active' : ''}" onclick="toggleLike(event, ${item.id})">
                            ${isLiked ? '❤️' : '🤍'}
                        </button>
                    </div>
                    <div class="card-content">
                        <div class="card-name">${item.title}</div>
                        <div class="card-price">${item.price}</div>
                        <div class="card-footer">
                            <span>📍 Сервер ${item.server}</span>
                            <span>${item.time}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Карточка товара
        function openProductDetails(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            if (!product) return;

            currentActiveProduct = product;

            document.getElementById('pModalImg').style.backgroundImage = `url('${product.image}')`;
            document.getElementById('pModalPrice').innerText = product.price;
            document.getElementById('pModalTitle').innerText = product.title;
            document.getElementById('pModalCategory').innerText = CATEGORY_NAMES[product.category] || "📦 Товар";
            document.getElementById('pModalServer').innerText = `📍 Сервер #${product.server}`;
            document.getElementById('pModalTag').innerText = product.tag;
            document.getElementById('pModalDesc').innerText = product.desc;

            document.getElementById('pModalSiteNick').innerText = product.seller.siteNick;
            document.getElementById('pModalNick').innerText = product.seller.nick;
            document.getElementById('pModalPhone').innerText = product.seller.phone;

            const btnTg = document.getElementById('btnTg');
            if (product.seller.hasTg && product.seller.tg) {
                btnTg.style.display = 'flex';
                btnTg.href = product.seller.tg;
            } else {
                btnTg.style.display = 'none';
            }

            const btnVk = document.getElementById('btnVk');
            if (product.seller.hasVk && product.seller.vk) {
                btnVk.style.display = 'flex';
                btnVk.href = product.seller.vk;
            } else {
                btnVk.style.display = 'none';
            }

            const btnDs = document.getElementById('btnDs');
            if (product.seller.hasDs && product.seller.discord) {
                btnDs.style.display = 'flex';
                document.getElementById('pModalDs').innerText = product.seller.discord;
            } else {
                btnDs.style.display = 'none';
            }

            toggleModal('productModal', true);
        }

        function switchTab(element, tabMode) {
            if (tabMode === 'create') {
                toggleModal('createModal', true);
                return;
            }

            document.querySelectorAll('.dock-tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');

            currentTabMode = tabMode;
            tg?.HapticFeedback?.selectionChanged();

            const feedContainer = document.getElementById('feedContainer');
            const profileSection = document.getElementById('profileSection');
            const searchBarBox = document.getElementById('searchBarBox');
            const titleElem = document.getElementById('sectionTitle');

            if (tabMode === 'profile') {
                feedContainer.style.display = 'none';
                profileSection.style.display = 'block';
                searchBarBox.style.display = 'none';
                titleElem.innerText = '👤 Профиль и мои настройки';
                document.getElementById('clearAuthorBtn').style.display = 'none';
                initProfileInputs();
                renderProfileSection();
            } else {
                feedContainer.style.display = tabMode === 'chats' ? 'block' : 'grid';
                profileSection.style.display = 'none';
                searchBarBox.style.display = 'flex';

                if (tabMode === 'wishlist') {
                    titleElem.innerText = '❤️ Избранные товары';
                    document.getElementById('clearAuthorBtn').style.display = 'none';
                } else if (tabMode === 'feed') {
                    titleElem.innerText = activeFilters.authorSiteNick ? `🛍️ Товары автора: ${activeFilters.authorSiteNick}` : '🔥 Все объявления';
                } else if (tabMode === 'chats') {
                    titleElem.innerText = '💬 Мои чаты';
                    document.getElementById('clearAuthorBtn').style.display = 'none';
                }

                renderFeed();
            }
        }

        function submitNewProduct() {
            const title = document.getElementById('createTitle').value.trim();
            const category = document.getElementById('createCategory').value;
            const server = document.getElementById('createServer').value;
            const priceVal = document.getElementById('createPrice').value;
            const isUrgent = document.getElementById('createUrgent').checked;
            const desc = document.getElementById('createDesc').value.trim();

            if (!title || !category || !server || !priceVal || !desc) {
                alert('Пожалуйста, заполните все обязательные поля!');
                return;
            }

            const priceNum = Number(priceVal);
            const formattedPrice = priceNum.toLocaleString('ru-RU') + ' ₽';
            const imgUrl = uploadedImageBase64 || 'https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=400';

            const newProduct = {
                id: Date.now(),
                title: title,
                price: formattedPrice,
                priceNum: priceNum,
                category: category,
                tag: isUrgent ? '🔥 СРОЧНО' : 'Новое',
                isUrgent: isUrgent,
                server: Number(server),
                time: 'Только что',
                image: imgUrl,
                desc: desc,
                seller: {
                    tgId: USER_PROFILE.tgId, // Закрепляем уникальный Telegram ID
                    siteNick: USER_PROFILE.siteNick,
                    nick: USER_PROFILE.gameNick,
                    phone: USER_PROFILE.gamePhone,
                    hasTg: USER_PROFILE.hasTg,
                    tg: USER_PROFILE.tgLink,
                    hasVk: USER_PROFILE.hasVk,
                    vk: USER_PROFILE.vkLink,
                    hasDs: Boolean(USER_PROFILE.discord),
                    discord: USER_PROFILE.discord
                }
            };

            PRODUCTS.unshift(newProduct);

            document.getElementById('createTitle').value = '';
            document.getElementById('createCategory').value = 'auto';
            document.getElementById('createServer').value = '';
            document.getElementById('createPrice').value = '';
            document.getElementById('createUrgent').checked = false;
            document.getElementById('createDesc').value = '';
            uploadedImageBase64 = null;
            document.getElementById('uploadPreview').style.backgroundImage = 'none';
            document.getElementById('uploadHint').style.display = 'block';

            tg?.HapticFeedback?.notificationOccurred('success');
            toggleModal('createModal', false);

            const feedTab = document.querySelectorAll('.dock-tab')[0];
            switchTab(feedTab, 'feed');
        }

        // Вспомогательные функции
        function handleSearchInput(v) { activeFilters.searchQuery = v.trim().toLowerCase(); renderFeed(); }
        function toggleLike(e, id) { e.stopPropagation(); likedProductIds.has(id) ? likedProductIds.delete(id) : likedProductIds.add(id); renderFeed(); }
        function toggleModal(id, show) { document.getElementById(id).classList.toggle('active', show); }
        function triggerFileInput(id) { document.getElementById(id).click(); }
        function handleImageSelect(e, pId, hId) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = function(ev) {
                uploadedImageBase64 = ev.target.result;
                document.getElementById(pId).style.backgroundImage = `url('${uploadedImageBase64}')`;
                document.getElementById(hId).style.display = 'none';
            };
            r.readAsDataURL(file);
        }

        function copyInGameInfo() {
            if (!currentActiveProduct) return;
            const t = `Ник: ${currentActiveProduct.seller.nick}, Тел: ${currentActiveProduct.seller.phone}`;
            navigator.clipboard.writeText(t);
            alert(`Скопировано:\n${t}`);
        }

        function copyDiscord() {
            if (!currentActiveProduct) return;
            navigator.clipboard.writeText(currentActiveProduct.seller.discord);
            alert(`Discord скопирован: ${currentActiveProduct.seller.discord}`);
        }

        function openChatFromProduct() {
            if (!currentActiveProduct) return;
            const sellerNick = currentActiveProduct.seller.siteNick;
            const productTitle = currentActiveProduct.title;

            let existingChat = CHATS.find(c => c.sellerSiteNick === sellerNick && c.productTitle === productTitle);

            if (!existingChat) {
                existingChat = {
                    id: Date.now(),
                    sellerSiteNick: sellerNick,
                    productTitle: productTitle,
                    avatar: "👤",
                    lastMsg: "Здравствуйте! Интересует ваш товар.",
                    time: "Только что",
                    unread: 0,
                    messages: [
                        { sender: 'me', text: `Здравствуйте! Меня заинтересовал ваш товар: ${productTitle}` }
                    ]
                };
                CHATS.unshift(existingChat);
            }

            toggleModal('productModal', false);
            openChatDialog(existingChat.id);
        }

        function openChatDialog(chatId) {
            const chat = CHATS.find(c => c.id === chatId);
            if (!chat) return;

            activeChatId = chatId;
            chat.unread = 0;

            document.getElementById('chatHeaderNick').innerText = chat.sellerSiteNick;
            document.getElementById('chatHeaderProduct').innerText = `📦 ${chat.productTitle}`;

            renderChatMessages(chat);
            toggleModal('chatConversationModal', true);
        }

        function renderChatMessages(chat) {
            const container = document.getElementById('chatMessagesList');
            container.innerHTML = '';
            chat.messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${msg.sender}`;
                bubble.innerText = msg.text;
                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            const chat = CHATS.find(c => c.id === activeChatId);
            if (!chat) return;

            chat.messages.push({ sender: 'me', text: text });
            chat.lastMsg = text;
            chat.time = 'Только что';

            input.value = '';
            renderChatMessages(chat);
        }

        function filterByCurrentAuthor() {
            if (!currentActiveProduct) return;
            activeFilters.authorSiteNick = currentActiveProduct.seller.siteNick;
            document.getElementById('sectionTitle').innerText = `🛍️ Товары автора: ${activeFilters.authorSiteNick}`;
            document.getElementById('clearAuthorBtn').style.display = 'inline-block';
            toggleModal('productModal', false);
            switchTab(document.querySelectorAll('.dock-tab')[0], 'feed');
        }

        function clearAuthorFilter() {
            activeFilters.authorSiteNick = null;
            document.getElementById('sectionTitle').innerText = '🔥 Все объявления';
            document.getElementById('clearAuthorBtn').style.display = 'none';
            renderFeed();
        }

        function applyFilters() {
            activeFilters.category = document.getElementById('categorySelect').value;
            activeFilters.server = document.getElementById('serverSelect').value;
            const pFrom = document.getElementById('priceFrom').value;
            const pTo = document.getElementById('priceTo').value;
            activeFilters.priceFrom = pFrom !== '' ? Number(pFrom) : null;
            activeFilters.priceTo = pTo !== '' ? Number(pTo) : null;
            toggleModal('filterModal', false);
            renderFeed();
        }

        function resetFilters() {
            document.getElementById('categorySelect').value = 'all';
            document.getElementById('serverSelect').value = 'all';
            document.getElementById('priceFrom').value = '';
            document.getElementById('priceTo').value = '';
            activeFilters.category = 'all';
            activeFilters.server = 'all';
            activeFilters.priceFrom = null;
            activeFilters.priceTo = null;
            renderFeed();
        }

        // Первичный рендер при загрузке
        renderFeed();
    </script>
</body>
</html>
